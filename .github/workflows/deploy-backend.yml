name: Deploy backend to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Values injected into the remote shell and used by deploy/backend/deploy.sh.
          MOTN_API_KEY: ${{ secrets.MOTN_API_KEY }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: MOTN_API_KEY,SITE_ADDRESS,FRONTEND_ORIGIN
          script: |
            set -e
            # Directory where the repo is cloned on the EC2 instance (see deploy/AWS_SETUP.md).
            APP_DIR="/home/ec2-user/app"
            cd "$APP_DIR"
            git pull --ff-only
            bash deploy/backend/deploy.sh
